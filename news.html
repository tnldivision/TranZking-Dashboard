<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tranzking - All Division News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tranzking: { main: '#05070a', card: '#0a0e14', accent: '#06b6d4', textPrimary: '#f8fafc', textSecondary: '#94a3b8', muted: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>body { background-color: #05070a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
</head>
<body class="min-h-screen p-6 md:p-12 relative">
    <div class="max-w-6xl mx-auto mb-10 flex justify-between items-center border-b border-tranzking-muted/30 pb-6">
        <div>
            <h1 class="text-3xl md:text-4xl font-black text-white uppercase tracking-tight">Division News Archive</h1>
            <p class="text-tranzking-textSecondary text-sm mt-1">All official updates and dispatches from tranzking.</p>
        </div>
        <a href="index.html" class="px-4 py-2 bg-tranzking-card border border-tranzking-muted/50 hover:border-tranzking-accent rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-2 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
        </a>
    </div>

    <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-6" id="allNewsContainer">
        <div class="col-span-full text-center py-20 text-tranzking-textSecondary">Loading news archive...</div>
    </div>

    <!-- NEWS DETAILS MODAL -->
    <div id="newsModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="bg-tranzking-card border border-tranzking-muted/50 w-full max-w-lg mx-4 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div id="newsModalImageContainer" class="w-full h-48 shrink-0 bg-tranzking-main relative bg-cover bg-center border-b border-tranzking-muted/30">
                <div class="absolute inset-0 bg-gradient-to-t from-tranzking-card to-transparent"></div>
                <button onclick="closeNewsModal()" class="absolute top-4 right-4 bg-red-600/80 p-1.5 rounded-full text-white hover:bg-red-600 transition-colors z-20"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 -mt-10 relative z-10">
                <span id="newsModalCategory" class="inline-block px-2.5 py-1 bg-tranzking-accent/20 text-tranzking-accent border border-tranzking-accent/30 text-[10px] font-black uppercase tracking-wider rounded-md mb-2 shadow-sm">CATEGORY</span>
                <h2 id="newsModalTitle" class="text-xl sm:text-2xl font-black text-white leading-tight mb-3">News Title Here</h2>
                <p id="newsModalDesc" class="text-tranzking-textSecondary text-sm mb-6 leading-relaxed">Full description goes here...</p>
                <a id="newsModalLink" href="#" target="_blank" class="w-full block text-center bg-tranzking-accent hover:opacity-90 text-[#05070a] font-bold py-3 rounded-lg transition-colors shadow-lg">Open Link <i data-lucide="external-link" class="w-4 h-4 inline-block ml-1 relative -top-0.5"></i></a>
            </div>
        </div>
    </div>

    <script src="home.js"></script>
    <script>
        function openNewsModal(title, category, image, desc, link) {
            document.getElementById('newsModalTitle').textContent = title;
            document.getElementById('newsModalCategory').textContent = category;
            document.getElementById('newsModalDesc').textContent = desc;
            
            let imgContainer = document.getElementById('newsModalImageContainer');
            if (image && image.startsWith('http')) {
                imgContainer.style.backgroundImage = `url('${image}')`;
            } else {
                imgContainer.style.backgroundImage = `linear-gradient(to right, #05070a, #0c1017)`;
            }
            
            let linkBtn = document.getElementById('newsModalLink');
            if (link && link !== '#' && link.startsWith('http')) {
                linkBtn.href = link;
                linkBtn.style.display = 'block';
            } else {
                linkBtn.style.display = 'none';
            }

            let modal = document.getElementById('newsModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function closeNewsModal() {
            let modal = document.getElementById('newsModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            let modal = document.getElementById('newsModal');
            if(modal) {
                modal.addEventListener('click', function(e) {
                    if(e.target === this) closeNewsModal();
                });
            }

            Papa.parse(NEWS_CSV_URL, { 
                download: true, 
                header: true, 
                skipEmptyLines: 'greedy',
                complete: function(results) {
                    if(results.data && results.data.length > 0) {
                        let html = "";
                        results.data.forEach(item => {
                            if(item.TITLE) {
                                // FIXED: Replace both single AND double quotes to prevent breaking the onclick attribute
                                let safeTitle = (item.TITLE || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                let safeCat = (item.CATEGORY || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                let safeImg = (item.IMAGE_URL || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                let safeDesc = (item.DESCRIPTION || '').replace(/'/g, "\\'").replace(/(\r\n|\n|\r)/gm, " ");
                                let safeLink = (item.LINK || '').replace(/'/g, "\\'");

                                html += `
                                <div class="bg-tranzking-card border border-tranzking-muted/50 rounded-xl overflow-hidden hover:border-tranzking-accent/50 transition-colors group flex flex-col justify-between">
                                    <div>
                                        <img src="${item.IMAGE_URL}" class="w-full h-48 object-cover opacity-80 group-hover:opacity-100 transition-opacity" onerror="this.src='https://placehold.co/600x400/0a0e14/06b6d4?text=tranzking+News'">
                                        <div class="p-6">
                                            <span class="text-[10px] text-tranzking-accent font-bold uppercase tracking-widest">${item.CATEGORY}</span>
                                            <h3 class="text-xl font-bold text-white mt-2 mb-3">${item.TITLE}</h3>
                                            <p class="text-sm text-tranzking-textSecondary mb-4 line-clamp-3">${item.DESCRIPTION}</p>
                                        </div>
                                    </div>
                                    <div class="px-6 pb-6">
                                        <button onclick="openNewsModal('${safeTitle}', '${safeCat}', '${safeImg}', '${safeDesc}', '${safeLink}')" class="text-xs font-bold text-white flex items-center gap-2 group-hover:text-tranzking-accent transition-colors cursor-pointer">READ MORE <i data-lucide="arrow-right" class="w-3 h-3"></i></button>
                                    </div>
                                </div>`;
                            }
                        });
                        document.getElementById('allNewsContainer').innerHTML = html || '<p class="col-span-full text-center text-tranzking-textSecondary">No news articles found.</p>';
                        if(typeof lucide !== 'undefined') lucide.createIcons();
                    }
                }
            });
        });
    </script>
</body>
</html>
